<!doctype html>
<meta charset="utf-8">
<title>mujoManipulation</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!--
  Phase 3. The geometry arrives once, a transform per geom arrives every frame,
  and the controller's draw primitives arrive with it — the same plain data the
  native MuJoCo renderer eats, drawn here by web/primitives.js. The controls are
  generated from what the server says it can run (web/controls.js); the equation
  panel and the plots are still to come.

  Two columns, no overlay and nothing that opens: the sidebar is simply part of
  the page. Two earlier attempts put the controls in a popup and both bugs were
  in its open/close state, not in the controls.

  three.js comes from a pinned CDN rather than a bundle, because this machine has
  no node and because a reader should be able to open these four files and see
  the whole client. `curl` the two URLs into web/vendor/ to work offline.
-->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>

<style>
  :root {
    --bg: #14161a;
    --sheet: #16181d;
    --line: #2b2f37;
    --line-soft: #23262d;
    --text: #e6e8ec;
    --dim: #8b919c;
    --dimmer: #5f656f;
    --good: #5bc98f;
    --bad: #e8705a;
    --accent: #7aa2f7;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    --side: 340px;
  }
  * { box-sizing: border-box; }
  /* An author `display` beats the user agent's `[hidden] { display: none }`.
     Nothing here relies on the attribute any more, but the rule costs one line
     and the trap cost two rounds of "it will not close". */
  [hidden] { display: none !important; }

  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
               font: 13px/1.5 system-ui, -apple-system, sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }

  #app { display: flex; height: 100%; }
  /* The stage and the plot strip share a column, so opening the strip takes
     height from the stage rather than covering it. */
  #right { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  /* --- the stage --- */
  /* The canvas is absolutely positioned and told its size in CSS. A canvas is a
     replaced element, so leaving `width: auto` under `inset: 0` does NOT stretch
     it — it lays out at its backing-store size, twice the window on a 2x
     display. `setSize(w, h, false)` then leaves the stylesheet in charge and
     there is no inline-versus-sheet fight to feed back into the measurement. */
  #stage { position: relative; flex: 1; min-width: 0; min-height: 0; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #note { position: absolute; bottom: 12px; left: 14px; color: var(--dimmer);
          font-family: var(--mono); font-size: 11px; }
  #note kbd { color: var(--dim); background: var(--line-soft);
              border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }

  /* --- the sidebar --- */
  #side { width: var(--side); flex: none; background: var(--sheet);
          border-right: 1px solid var(--line); overflow-y: auto;
          padding: 16px 16px 20px; }
  #side h1 { margin: 0 0 12px; font-size: 12px; letter-spacing: .08em;
             text-transform: uppercase; color: var(--dim); font-weight: 600; }
  .section-head { display: flex; align-items: center; gap: 7px; width: 100%;
                  margin: 18px 0 9px; padding: 0; background: transparent;
                  border: 0; font-size: 11px; letter-spacing: .1em;
                  text-transform: uppercase; color: var(--dim); font-weight: 600; }
  .section-head:first-child { margin-top: 0; }
  .section-head:hover { color: var(--text); }
  .section-head.folded { margin-bottom: 0; }
  .caret { font-size: 13px; line-height: 1; width: 9px; }

  #readout { font-family: var(--mono); font-size: 11.5px; line-height: 1.75;
             padding-bottom: 14px; border-bottom: 1px solid var(--line-soft); }
  #readout .row { display: flex; justify-content: space-between; gap: 12px; }
  #readout .k { color: var(--dim); }
  #st-run { color: var(--accent); text-align: right; }
  .up { color: var(--good); }
  .down { color: var(--bad); }

  /* --- a rung --- */
  .card { border: 1px solid var(--line-soft); border-radius: 9px;
          padding: 11px 12px; margin: 8px 0; }
  .card.active { border-color: var(--accent); background: rgba(122, 162, 247, 0.06); }
  .card.soon { opacity: .4; }
  .card-head { display: flex; align-items: center; gap: 8px; width: 100%;
               background: transparent; border: 0; padding: 0; text-align: left; }
  .card-head:disabled { cursor: default; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dimmer);
         flex: none; }
  .card.active .dot { background: var(--accent); }
  .card-title { font-weight: 600; }
  /* Wrap between terms, never inside one. */
  .equation { font-family: var(--mono); font-size: 12px; margin: 8px 0 10px; }
  .equation .term { font-weight: 600; white-space: nowrap; }
  /* A term the running rung can switch is a button in its own colour. */
  .equation button.term { background: transparent; border: 0; padding: 0 1px;
                          font: inherit; font-weight: 600; border-bottom: 1px dotted;
                          border-color: currentColor; }
  .equation button.term:hover { background: rgba(255, 255, 255, 0.07);
                                border-radius: 3px; }
  .equation .term.off { text-decoration: line-through; opacity: .45;
                        border-bottom-color: transparent; }
  .no-gains { margin: 8px 0 0; font-size: 11px; color: var(--dimmer);
              font-family: var(--mono); }

  .refs { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; }
  .refs + .refs, .refs + .slider { margin-top: 13px; }
  .refs-label { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase;
                color: var(--dim); }
  .chip-row { display: flex; flex-wrap: wrap; gap: 5px; }
  .toggles { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
  .view-section .toggles { margin-top: 14px; padding-top: 12px;
                           border-top: 1px solid var(--line-soft); }
  .chip { background: transparent; border: 1px solid var(--line);
          border-radius: 20px; padding: 3px 10px; font-size: 12px; }
  .chip:hover { border-color: var(--dim); }
  .chip.on { border-color: var(--accent); background: rgba(122, 162, 247, 0.12); }

  .view-section { border: 1px solid var(--line-soft); border-radius: 9px;
                  padding: 12px; }
  .slider + .slider { margin-top: 14px; }
  .slider-head { display: flex; justify-content: space-between; align-items: baseline; }
  .slider-label { font-size: 12px; }
  .slider-value { font-family: var(--mono); font-size: 11.5px; color: var(--dim); }
  .slider input { width: 100%; margin: 6px 0 0; accent-color: var(--accent); }
  .buttons { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px;
             padding-top: 12px; border-top: 1px solid var(--line-soft); }

  /* --- the plot strip --- */
  #plot-strip { flex: none; background: var(--sheet);
                border-top: 1px solid var(--line); }
  #plot-bar { display: flex; align-items: center; gap: 10px; padding: 9px 12px; }
  #plot-bar .grow { flex: 1; }
  /* `display` is set here, so visibility is a class -- see the note at the top. */
  #plots { display: none; gap: 12px; padding: 0 12px 12px; }
  #plots.open { display: flex; }
  .plot { flex: 1; min-width: 0; }
  .plot-head { display: flex; justify-content: space-between; align-items: baseline;
               font-size: 11px; color: var(--dim); padding-bottom: 3px; }
  .plot-value { font-family: var(--mono); font-size: 11px; color: var(--dimmer); }
  .plot canvas { width: 100%; height: 104px; display: block;
                 background: rgba(0, 0, 0, 0.18); border-radius: 5px; }

  /* Narrow windows stack instead of squeezing the stage to nothing. */
  @media (max-width: 760px) {
    #app { flex-direction: column; }
    #side { width: 100%; border-right: none; border-bottom: 1px solid var(--line);
            max-height: 45%; }
    #stage { min-height: 55%; }
  }
</style>

<div id="app">
  <aside id="side">
    <h1>mujoManipulation</h1>
    <div id="readout">
      <div class="row"><span class="k">running</span><span id="st-run">—</span></div>
      <div class="row"><span class="k">socket</span><span id="st-socket" class="down">connecting</span></div>
      <div class="row"><span class="k">sim time</span><span id="st-time">—</span></div>
      <div class="row"><span class="k">frames/s</span><span id="st-fps">—</span></div>
      <div class="row"><span class="k">geoms</span><span id="st-geoms">—</span></div>
      <div class="row"><span class="k">drawn</span><span id="st-draw">—</span></div>
    </div>
    <div id="controls"></div>
  </aside>

  <div id="right">
    <div id="stage">
      <canvas id="view"></canvas>
      <div id="note">drag to orbit · scroll to zoom · <kbd>R</kbd> reset camera</div>
    </div>

    <section id="plot-strip">
      <div id="plot-bar">
        <button id="plot-toggle" class="section-head folded">
          <span class="caret">&rsaquo;</span><span>plots</span>
        </button>
        <span class="grow"></span>
        <span class="plot-value">10 s window</span>
        <button id="plot-clear" class="chip">clear</button>
      </div>
      <div id="plots"></div>
    </section>
  </div>
</div>

<script type="module" src="/web/app.js"></script>
